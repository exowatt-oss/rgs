<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="RGS — your agent in every call." />
    <title>RGS · Live call companion</title>
    <script>
      // Theme before first paint (lib/theme.tsx owns it afterwards): stored
      // choice, else the OS preference. No flash of the wrong theme.
      ;(function () {
        try {
          var c = localStorage.getItem('rgs-theme')
          var dark = c === 'dark' || (c !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
