# Alembic configuration. The actual database URL is read from `Settings`
# in `alembic/env.py`; the `sqlalchemy.url` placeholder below is required
# but unused at runtime.

[alembic]
script_location = %(here)s/alembic

# Prepend `src` to sys.path so `from app.config import get_settings` works
# in `env.py`.
prepend_sys_path = .:src

path_separator = os

sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Optional auto-format for generated revisions. Off by default.
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
