name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://dev:dev@localhost:5432/app
      FORWARDED_AUTH_MODE: none
      FORWARDED_AUTH_ALLOW_INSECURE_NONE_MODE: "1"
      RECAP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
      - run: uv run ruff check src tests
        working-directory: backend
      - run: uv build
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test -- --maxWorkers=4
        working-directory: frontend
